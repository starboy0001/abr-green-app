allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

subprojects { subproject ->
    subproject.plugins.withId("com.android.library") {
        if (subproject.android.namespace == null) {
            def manifestFile = subproject.file("src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                try {
                    def manifest = new XmlParser().parse(manifestFile)
                    subproject.android.namespace = manifest.attribute('package')
                } catch (Exception e) {
                    // Fallback if parsing fails
                }
            }
            if (subproject.android.namespace == null || subproject.android.namespace.isEmpty()) {
                subproject.android.namespace = "com.plugin.${subproject.name.replace('-', '_')}"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
